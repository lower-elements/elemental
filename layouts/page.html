{{ define "main" }}
{{ $sidebar := partial "sidebar.html" . }}
<div class="row">
  <article class="{{ if $sidebar }}col-lg-9{{ else }}col{{ end }}">
    <header>
      <h1>{{ .Title }}</h1>
      {{ partial "post-info.html" . }}
    </header>
    {{ .Content }}
  </article>
  {{ with $sidebar }}
  <aside class="col-lg-3 order-last">
    <div class="elemental-sidebar">
      {{ . }}
    </div>
  </aside>
  {{ end }}
</div>
{{ end }}
