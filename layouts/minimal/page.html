{{- define "main" }}
<header>
<h1>{{ .Title }}</h1>
</header>
{{ .Content }}
<footer>
<time datetime="{{ .Lastmod.Format "2006-01-02" }}">{{ T "last_modified" (.Lastmod | time.Format ":date_long") }}</time>
      {{ with .Param "editor" -}}
      {{ T "by" . }}
      {{- else with .GitInfo -}}
      {{ T "by" .AuthorName }}
      {{- end -}}
</footer>
    {{ end -}}
