{{ define "main" }}
<h1 class="visually-hidden">{{ .Title }}</h1>
{{ partial "alt-formats.html" . }}
{{ .Content }}
<hr>
{{ with .Pages }}
<section aria-label="Articles">
{{ range . }}
{{ .Render "_views/post-card" }}
{{ end }}
</section>
{{ else -}}
<p>No posts here yet. Check back later or subscribe to be notified of new posts</p>
{{ end }}
{{ end }}
