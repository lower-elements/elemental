{{ define "main" }}
<h1 class="visually-hidden">{{ .Title }}</h1>
{{ partial "alt-formats.html" . }}
{{ .Content }}
<hr>
{{ with .Pages }}
<section aria-label="{{ T `articles` }}">
{{ range . }}
{{ .Render "_views/post-card" }}
{{ end }}
</section>
{{ else -}}
<p>{{ T "no_posts" }}</p>
{{ end }}
{{ end }}
