{{ define "main" }}
<h1 class="h2">{{ .Title }}</h1>
{{ partial "alt-formats.html" . }}
{{ .Content }}
<hr>
{{ with .Pages }}
<section class="mx-auto reading-column" aria-label="{{ T `articles` }}">
{{ range . -}}
{{ partial "post-card.html" . }}
{{ end -}}
</section>
{{ else -}}
<p>{{ T "no_posts" }}</p>
{{ end }}
{{ end }}
