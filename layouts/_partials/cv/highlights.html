<ul{{ with .listClass }} class="{{ . }}"{{ end }}>
  {{- range $highlightID := .highlightIDs -}}
    {{- $highlight := index $.highlights $highlightID -}}
    {{- if not $highlight -}}
      {{- errorf "CV entry %q has no highlight %q. See %s" $.owner $highlightID $.position -}}
    {{- end }}
    <li{{ with $.itemClass }} class="{{ . }}"{{ end }}>{{ $.page.RenderString (dict "display" "inline") $highlight }}</li>
  {{- end }}
</ul>
