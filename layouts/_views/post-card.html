<div class="row justify-content-center mb-3">
    <div class="col-md-10">
        <article class="card">
            <header class="card-header">
                <h2 class="card-title"><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></h2>
                {{ if not (or .Site.Params.hidePostCardMeta .Params.hidePostCardMeta) }}
                {{ partial "post-info" . }}
                {{ end -}}
                </header>
                <div class="card-body">
                    {{ .Description | default .Plain | truncate 280 }}
                </div>
                <footer class="card-footer">
                    <a class="card-link" href="{{ .RelPermalink }}">Read More</a>
                </footer>
        </article>
    </div>
</div>
